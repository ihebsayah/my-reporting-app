version: "3.9"

services:
  # ── FastAPI extraction & pipeline API ────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfe_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DATABASE_URL: sqlite:////app/data/reporting_app.db
      RF_MODEL_OUTPUT_DIR: /app/artifacts/models/rf_confidence
      NER_MODEL_PATH: /app/artifacts/models/ner
      AUTO_APPROVAL_THRESHOLD: "0.90"
      REVIEW_MIN_THRESHOLD: "0.70"
      REVIEW_MAX_THRESHOLD: "0.89"
      LOG_LEVEL: INFO
    volumes:
      - api_artifacts:/app/artifacts
      - api_data:/app/data
      - api_feedback:/app/artifacts/feedback
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - pfe_net

  # ── AI Agent microservice (NEW) ───────────────────────────────────────────────
  agents:
    build:
      context: .
      dockerfile: agents/Dockerfile.agents
    container_name: pfe_agents
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      # Agent service config
      AGENT_SERVICE_HOST: "0.0.0.0"
      AGENT_SERVICE_PORT: "8001"
      AGENTS_ENABLED: "true"
      LOG_LEVEL: INFO
      LOG_AGENT_REASONING: "true"

      # Upstream FastAPI (agents call ML tools via HTTP)
      API_BASE_URL: http://api:8000

      # LLM (Ollama with Mistral — running locally or in a separate container)
      LLM_BASE_URL: http://ollama:11434
      LLM_MODEL_NAME: mistral
      LLM_TEMPERATURE: "0.1"
      LLM_MAX_TOKENS: "1024"

      # Redis (real-time learning)
      REDIS_URL: redis://redis:6379/0
      REDIS_TTL_SECONDS: "604800"
      REDIS_PATTERN_TTL_SECONDS: "2592000"

      # Same SQLite DB as the main app (read vendor history, write agent decisions)
      DATABASE_URL: sqlite:////app/data/reporting_app.db

      # Safety thresholds
      SAFETY_MAX_AMOUNT: "100000"
      AGENT_AUTO_APPROVE_THRESHOLD: "0.85"
      AGENT_HUMAN_REVIEW_THRESHOLD: "0.65"

      # Auto-rollback triggers
      ROLLBACK_ACCURACY_THRESHOLD: "0.85"
      ROLLBACK_OVERRIDE_RATE_THRESHOLD: "0.30"
      ROLLBACK_WINDOW_SIZE: "100"
    volumes:
      - api_artifacts:/app/artifacts
      - api_data:/app/data
      - agent_logs:/app/artifacts/agent_logs
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - pfe_net

  # ── Redis (real-time agent memory) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: pfe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - pfe_net

  # ── Ollama (local LLM server — Mistral) ──────────────────────────────────────
  # Note: Pulling Mistral requires ~4GB disk. Comment this service out
  # during early development to test with tool-only mode (no LLM reasoning).
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: pfe_ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_models:/root/.ollama
  #   networks:
  #     - pfe_net

  # ── Streamlit KPI dashboard ───────────────────────────────────────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pfe_dashboard
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      APP_ENV: production
      DATABASE_URL: sqlite:////app/data/reporting_app.db
      RF_MODEL_OUTPUT_DIR: /app/artifacts/models/rf_confidence
      NER_MODEL_PATH: /app/artifacts/models/ner
      LOG_LEVEL: INFO
      API_BASE_URL: http://api:8000
      AGENT_SERVICE_URL: http://agents:8001
    volumes:
      - api_artifacts:/app/artifacts
      - api_data:/app/data
      - api_feedback:/app/artifacts/feedback
    depends_on:
      api:
        condition: service_healthy
    command: ["streamlit", "run", "app/dashboard/app.py",
              "--server.port", "8501",
              "--server.address", "0.0.0.0",
              "--server.headless", "true"]
    networks:
      - pfe_net

  # ── Label Studio annotation tool ──────────────────────────────────────────
  label_studio:
    image: heartexlabs/label-studio:latest
    container_name: pfe_label_studio
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      DJANGO_DB: default
      POSTGRE_NAME: ""
      LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED: "true"
    volumes:
      - label_studio_data:/label-studio/data
    networks:
      - pfe_net

volumes:
  api_artifacts:
  api_data:
  api_feedback:
  label_studio_data:
  redis_data:           # NEW: Redis persistence
  agent_logs:           # NEW: Agent JSONL audit logs
  # ollama_models:      # Uncomment when enabling Ollama service

networks:
  pfe_net:
    driver: bridge
